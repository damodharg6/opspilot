[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "AI on-call agent that investigates production incidents through MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
include = ["common*", "shop*", "mcp_servers*", "opspilot*", "evals*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
    "S101",   # assert is fine in tests
    "S311",   # random is fine for load generation, not crypto
    "RUF012", # mutable class defaults are fine for pydantic/sqlalchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "ASYNC240"]
"evals/**" = ["ASYNC240"]  # small sequential file I/O in a CLI harness

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: needs a Postgres database (TEST_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]
